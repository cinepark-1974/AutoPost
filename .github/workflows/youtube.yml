name: CINEPARK YouTube Factory - 5min + Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 매일 오전 7시 KST

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Node 24)
        uses: actions/checkout@v5

      - name: Setup Python (Node 24)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run YouTube Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OURIMALSAEM_API_KEY: ${{ secrets.OURIMALSAEM_API_KEY }}
          GDRIVE_FOLDER_ID_OUTPUT: ${{ secrets.GDRIVE_FOLDER_ID_OUTPUT }}
          GDRIVE_FOLDER_ID_BACKGROUND: ${{ secrets.GDRIVE_FOLDER_ID_BACKGROUND }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON_CONTENT: ${{ secrets.GOOGLE_CREDENTIALS_JSON_CONTENT }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          python main.py

      - name: Upload output as artifact (Node 24)
        uses: actions/upload-artifact@v5
        with:
          name: cinepark-output
          path: output/
