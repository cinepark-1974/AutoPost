name: CINEPARK YouTube Factory - 20 Plates Clean

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg + Korean fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-coding fonts-nanum-extra
          fc-cache -fv
          fc-list :lang=ko

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Factory (20 Plates)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OURIMALSAEM_API_KEY: ${{ secrets.OURIMALSAEM_API_KEY }}
          GDRIVE_FOLDER_ID_OUTPUT: ${{ secrets.GDRIVE_FOLDER_ID_OUTPUT }}
          GDRIVE_FOLDER_ID_BACKGROUND: ${{ secrets.GDRIVE_FOLDER_ID_BACKGROUND }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON_CONTENT: ${{ secrets.GOOGLE_CREDENTIALS_JSON_CONTENT }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cinepark-20plates
          path: output/
          retention-days: 7
