name: Daily Hollywood CardNews

on:
  schedule:
    - cron: '0 23 * * *'  # KST 08:00 = UTC 23:00
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_FOLDER_ID_Background: ${{ secrets.GDRIVE_FOLDER_ID_Background }}
          GDRIVE_FOLDER_ID_Output: ${{ secrets.GDRIVE_FOLDER_ID_Output }}
          GOOGLE_CREDENTIALS_JSON_CONTENT: ${{ secrets.GOOGLE_CREDENTIALS_JSON_CONTENT }}
          GOOGLE_CREDENTIALS_JSON: ./credentials.json
        run: |
          python main.py
