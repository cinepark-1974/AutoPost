name: Daily Hollywood CardNews
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt google-api-python-client google-auth yfinance anthropic openai
      - name: Patch all files (final)
        run: |
          cat > utils/drive_uploader.py << 'PY'
          import os, json, random, io
          from pathlib import Path
          def get_drive_service():
              from google.oauth2 import service_account
              from googleapiclient.discovery import build
              scopes=["https://www.googleapis.com/auth/drive"]
              jc=os.getenv("GOOGLE_CREDENTIALS_JSON_CONTENT")
              if jc:
                  try:
                      info=json.loads(jc)
                      creds=service_account.Credentials.from_service_account_info(info, scopes=scopes)
                      print("Drive 인증: JSON_CONTENT 사용")
                      return build("drive","v3",credentials=creds)
                  except Exception as e:
                      print(f"JSON 파싱 실패: {e}")
              cp=os.getenv("GOOGLE_CREDENTIALS_JSON","./credentials.json")
              if Path(cp).exists():
                  from google.oauth2 import service_account
                  from googleapiclient.discovery import build
                  creds=service_account.Credentials.from_service_account_file(cp, scopes=scopes)
                  return build("drive","v3",credentials=creds)
              print("credentials 없음")
              return None
          def get_background_id():
              return os.getenv('GDRIVE_FOLDER_ID_BACKGROUND') or os.getenv('GDRIVE_FOLDER_ID_BACKGROUND_IMAGES') or os.getenv('GDRIVE_FOLDER_ID_Background') or ''
          def download_random_background(fid):
              if not fid:
                  fid=get_background_id()
              if not fid: return None
              try:
                  s=get_drive_service()
                  if not s: return None
                  q=f"'{fid}' in parents and trashed=false and mimeType contains 'image/'"
                  res=s.files().list(q=q, fields="files(id, name)", pageSize=100, supportsAllDrives=True, includeItemsFromAllDrives=True).execute()
                  files=res.get('files',[])
                  if not files:
                      print("Background 폴더 비어있음")
                      return None
                  ch=random.choice(files)
                  print(f"Background 선택: {ch['name']}")
                  from googleapiclient.http import MediaIoBaseDownload
                  req=s.files().get_media(fileId=ch['id'])
                  fh=io.BytesIO()
                  dl=MediaIoBaseDownload(fh, req)
                  done=False
                  while not done:
                      _,done=dl.next_chunk()
                  tmp=f"/tmp/bg_{ch['name']}"
                  open(tmp,'wb').write(fh.getvalue())
                  return tmp
              except Exception as e:
                  print(f"BG 실패: {e}")
                  return None
          def upload_to_drive(local_folder, drive_folder_id=None):
              user_email=os.getenv('USER_EMAIL') or os.getenv('GDRIVE_USER_EMAIL') or ''
              if not drive_folder_id:
                  print("OUTPUT ID 없음 → 드라이브 스킵")
                  return
              try:
                  service=get_drive_service()
                  if not service: return
                  from googleapiclient.http import MediaFileUpload
                  folder_name=Path(local_folder).name
                  meta={"name":folder_name,"mimeType":"application/vnd.google-apps.folder","parents":[drive_folder_id]}
                  folder=service.files().create(body=meta, fields="id", supportsAllDrives=True).execute()
                  nid=folder.get("id")
                  print(f"Drive 폴더 생성: {folder_name} ({nid})")
                  # 폴더 소유권 이전 시도
                  if user_email:
                      try:
                          service.permissions().create(fileId=nid, body={"type":"user","role":"owner","emailAddress":user_email}, transferOwnership=True, supportsAllDrives=True).execute()
                          print(f"  폴더 소유권 이전: {user_email}")
                      except Exception as e:
                          print(f"  폴더 소유권 이전 실패(무시): {e}")
                  for f in Path(local_folder).glob("*"):
                      if not f.is_file(): continue
                      try:
                          media=MediaFileUpload(str(f), resumable=True)
                          created=service.files().create(body={"name":f.name,"parents":[nid]}, media_body=media, fields="id", supportsAllDrives=True).execute()
                          fid=created.get("id")
                          print(f"  업로드: {f.name} ({fid})")
                          if user_email:
                              try:
                                  service.permissions().create(fileId=fid, body={"type":"user","role":"owner","emailAddress":user_email}, transferOwnership=True, supportsAllDrives=True).execute()
                              except Exception as oe:
                                  print(f"    소유권 이전 실패: {oe}")
                      except Exception as e:
                          msg=str(e)
                          if "storage quota" in msg.lower() or "storageQuotaExceeded" in msg or "quota" in msg.lower():
                              print(f"  ! quota 에러: {msg[:200]}")
                          else:
                              print(f"  업로드 실패 {f.name}: {e}")
                  print(f"Drive 처리 완료")
              except Exception as e:
                  print(f"Drive 실패(무시): {e}")
                  # 절대 raise 안 함
          PY
          cat > utils/stock.py << 'PY'
          def _fetch(ticker):
              try:
                  import yfinance as yf
                  t=yf.Ticker(ticker)
                  hist=t.history(period="7d")
                  if hist.empty:
                      raise ValueError("empty")
                  close=float(hist['Close'].iloc[-1])
                  prev=float(hist['Close'].iloc[-2]) if len(hist)>1 else close
                  change=((close-prev)/prev*100) if prev else 0
                  return {"ticker":ticker,"close":round(close,2),"change":round(change,2),"history":[],"chart_path":None}
              except Exception as e:
                  print(f"주식 {ticker} 실패 → 더미: {e}")
                  return {"ticker":ticker,"close":0,"change":0,"history":[],"chart_path":None,"date":""}

          def get_stock_data(ticker):
              return _fetch(ticker)

          def get_stock_info(ticker):
              return _fetch(ticker)

          # 호환성
          get_stock_data = get_stock_data
          get_stock_info = get_stock_info
          PY
      - name: Run generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_FOLDER_ID_BACKGROUND: ${{ secrets.GDRIVE_FOLDER_ID_BACKGROUND || secrets.GDRIVE_FOLDER_ID_BACKGROUND_IMAGES || secrets.GDRIVE_FOLDER_ID_Background }}
          GDRIVE_FOLDER_ID_OUTPUT: ${{ secrets.GDRIVE_FOLDER_ID_OUTPUT }}
          GOOGLE_CREDENTIALS_JSON_CONTENT: ${{ secrets.GOOGLE_CREDENTIALS_JSON_CONTENT }}
        run: |
          python main.py
          echo "=== output folder list ==="
          ls -R output || echo "output 없음"
      - name: Upload cards artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-cards
          path: output/
          if-no-files-found: warn
